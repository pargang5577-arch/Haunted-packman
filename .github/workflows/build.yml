name: Build Windows exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pygame pyinstaller
      - name: Build exe
        run: pyinstaller --onefile --windowed --name HauntedCastlePacman haunted_pacman.py
      - uses: actions/upload-artifact@v4
        with:
          name: HauntedCastlePacman-exe
          path: dist/HauntedCastlePacman.exe
